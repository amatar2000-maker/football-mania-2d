<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football Mania 2D</title>
<style>
  :root { --neon:#00ff88; --gold:#ffcc00; --dark:#070b14; --panel:#121a2b; --accent:#00d2ff; }
  * { box-sizing:border-box; user-select:none; -webkit-user-select:none; margin:0; padding:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--dark); color:#fff; overflow:hidden; width:100%; height:100%; }

  #bgCanvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }
  .screen { display:none; position:absolute; inset:0; z-index:1; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:space-between; padding:12px; background:radial-gradient(circle at center,#1b2840,#090c12); overflow-y:auto; }
  .screen.active { display:flex; }
  .screen.transparent { background:transparent; }

  .header { width:100%; max-width:960px; padding:6px 12px; border-bottom:2px solid var(--neon); display:flex; justify-content:space-between; align-items:center; gap:8px; background:rgba(0,0,0,.45); border-radius:10px; flex-shrink:0; backdrop-filter:blur(6px); }
  .logo { font-size:1.05rem; font-weight:900; color:var(--neon); letter-spacing:1px; }

  .btn { background:linear-gradient(45deg,var(--neon),var(--accent)); color:#00140c; font-weight:900; padding:8px 22px; border:none; border-radius:10px; cursor:pointer; font-size:.9rem; text-transform:uppercase; box-shadow:0 0 15px rgba(0,255,136,.4); transition:transform .15s; }
  .btn:active { transform:scale(.95); }
  .btn-secondary { background:#26334d; color:#fff; box-shadow:none; }
  .btn-small { padding:4px 10px; font-size:.72rem; }

  /* Menu */
  .menu-wrap { flex:1; width:100%; max-width:900px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
  .menu-title { font-size:clamp(1.6rem,6vw,2.6rem); font-weight:900; font-style:italic; background:linear-gradient(#fff,#ffe27a,#ff9d00); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 14px rgba(255,170,0,.55)); letter-spacing:2px; }
  .menu-sub { color:var(--neon); font-weight:800; font-size:.8rem; letter-spacing:3px; text-transform:uppercase; }
  .mode-container { display:grid; grid-template-columns:repeat(2,minmax(140px,1fr)); gap:12px; width:100%; max-width:520px; }
  @media (min-width:760px){ .mode-container{ grid-template-columns:repeat(4,1fr); max-width:900px; } }
  .card { background:linear-gradient(160deg,rgba(30,44,72,.85),rgba(14,20,34,.85)); border:2px solid rgba(120,150,210,.28); border-radius:16px; padding:16px 10px; text-align:center; cursor:pointer; box-shadow:0 8px 22px rgba(0,0,0,.55); transition:.2s; backdrop-filter:blur(6px); }
  .card:hover { border-color:var(--neon); transform:translateY(-3px); }
  .card:active { transform:scale(.97); }
  .card .ico { font-size:1.9rem; margin-bottom:4px; }
  .card h2 { color:var(--gold); margin-bottom:4px; font-size:.95rem; }
  .card p { color:#b0c4de; font-size:.72rem; line-height:1.3; }
  .card { position:relative; }
  .save-badge { display:none; position:absolute; top:-9px; right:-6px; background:linear-gradient(#ffe27a,#ff9d00); color:#1a0f00; font-weight:900; font-size:.62rem; padding:3px 8px; border-radius:10px; border:2px solid #14213d; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #toast { position:fixed; left:50%; top:16px; transform:translate(-50%,-80px); z-index:300; background:#121a2b; color:#fff; border:2px solid var(--neon); padding:9px 18px; border-radius:22px; font-weight:800; font-size:.85rem; transition:transform .3s ease; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.5); white-space:nowrap; }
  #toast.show { transform:translate(-50%,0); }
  .settings-dlg { max-width:420px; }
  .set-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 2px; border-bottom:1px solid #26334d; font-weight:800; font-size:.9rem; }
  .seg { display:flex; background:#0b1120; border-radius:10px; padding:3px; gap:3px; }
  .seg button { background:transparent; color:#b0c4de; border:0; padding:6px 12px; border-radius:8px; font-weight:800; cursor:pointer; font-size:.8rem; }
  .seg button.on { background:linear-gradient(45deg,var(--neon),var(--accent)); color:#00140c; }
  .hud, .res-row { direction:ltr; }
  .hud-team span, .turn-pill { unicode-bidi:plaintext; }
  td.nm { text-align:start !important; }
  td.nm img { margin-right:0 !important; margin-inline-end:6px; }
  html[dir=rtl] .dlg-body, html[dir=rtl] .menu-wrap { direction:rtl; }
  .score-box, .res-score { direction:ltr; unicode-bidi:isolate; }
  @media (max-height:620px) { .settings-section { margin:3px 0; } .settings-section h4 { margin-bottom:3px; font-size:.82rem; } .opt-card { padding:5px 8px; } .opt-card canvas[data-stad] { width:84px; height:52px; } .opt-card canvas[data-ball] { width:28px; height:28px; } }
  td:not(.nm) { direction:ltr; unicode-bidi:isolate; }
  .foot-note { font-size:.7rem; color:#94a3b8; text-align:center; padding-bottom:4px; }

  /* Team select */
  .selector-box { width:100%; max-width:960px; flex:1; display:flex; flex-direction:column; gap:6px; overflow:hidden; margin:6px 0; }
  .league-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; justify-content:center; flex-wrap:wrap; flex-shrink:0; }
  .tab { padding:6px 12px; background:#1c263b; border-radius:8px; cursor:pointer; font-weight:bold; font-size:.75rem; color:#ccc; }
  .tab.active { background:var(--neon); color:#000; }
  .teams-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; overflow-y:auto; padding:8px; background:rgba(0,0,0,.35); border-radius:12px; flex:1; align-content:start; }
  .team-item { background:var(--panel); padding:8px 4px; border-radius:12px; border:2px solid #283650; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; transition:.15s; }
  .team-item:hover { border-color:var(--neon); background:#1b2a46; }
  .team-item.taken { opacity:.3; pointer-events:none; }
  .team-item canvas { display:block; }
  .team-name { font-weight:bold; font-size:.74rem; text-align:center; }
  .ovr-badge { background:#000; color:var(--neon); padding:1px 6px; border-radius:4px; font-size:.65rem; font-weight:bold; }

  /* Modals */
  .modal-screen { position:absolute; inset:0; background:rgba(7,10,18,.96); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:flex-start; padding:15px; overflow-y:auto; }
  .modal-screen > :first-child { margin-top:auto; } .modal-screen > :last-child { margin-bottom:auto; }
  .settings-wrap { width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; }
  @media (max-height:600px) and (min-width:620px) { .settings-wrap { max-width:980px; display:grid; grid-template-columns:1fr 1fr; gap:0 18px; align-items:start; } .settings-wrap .settings-section { margin:3px 0; } }
  .settings-section { margin:7px 0; width:100%; max-width:640px; text-align:center; }
  .settings-section h4 { color:var(--gold); margin-bottom:6px; font-size:.92rem; }
  .options-grid { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .opt-card { background:var(--panel); border:2px solid #283650; border-radius:10px; padding:8px 12px; cursor:pointer; transition:.2s; font-size:.78rem; flex:1; min-width:104px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .opt-card.selected { border-color:var(--gold); background:#1f2d48; box-shadow:0 0 12px rgba(255,204,0,.3); font-weight:bold; }
  .opt-card canvas { border-radius:6px; display:block; }

  .table-wrap { width:100%; max-width:950px; flex:1; overflow-y:auto; background:var(--panel); border-radius:12px; padding:8px; border:1px solid #283650; margin:6px 0; }
  table { width:100%; border-collapse:collapse; font-size:.78rem; }
  th, td { padding:5px; text-align:center; border-bottom:1px solid #283650; }
  td.nm { text-align:left; }
  td.nm img { width:20px; height:20px; vertical-align:middle; margin-right:6px; }
  th { color:var(--neon); background:#0e1420; position:sticky; top:0; }
  tr.user-row { background:rgba(0,255,136,.18); font-weight:bold; }

  /* Game */
  #gameScreen { padding:4px; justify-content:flex-start; gap:4px; background:#070b14; overflow:hidden; }
  .hud { width:100%; max-width:960px; background:linear-gradient(180deg,#141d31,#0b1120); border:2px solid var(--gold); border-radius:12px; padding:4px 10px; display:flex; justify-content:space-between; align-items:center; gap:6px; font-weight:900; flex-shrink:0; flex-wrap:wrap; }
  .hud-team { display:flex; align-items:center; gap:6px; font-size:.85rem; min-width:0; }
  .hud-team span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:26vw; }
  .hud-mid { display:flex; flex-direction:column; align-items:center; }
  .score-box { background:linear-gradient(#ffe27a,#ffb300); color:#000; padding:2px 14px; border-radius:8px; font-size:1.15rem; font-weight:900; box-shadow:0 0 14px rgba(255,200,0,.5); }
  .first-to { font-size:.55rem; color:#9fb3d6; letter-spacing:1px; margin-top:1px; }
  .turn-pill { padding:3px 8px; border-radius:12px; font-size:.7rem; background:#1e293b; color:var(--neon); border:1px solid var(--neon); }
  .board-container { width:100%; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  #pitchCanvas { display:block; border-radius:10px; box-shadow:0 0 28px rgba(0,0,0,.85); touch-action:none; }
  .rotate-hint { display:none; position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:5; background:rgba(10,16,30,.92); border:1px solid var(--neon); color:#eafff4; padding:8px 14px; border-radius:20px; font-size:.78rem; font-weight:800; white-space:nowrap; cursor:pointer; }
  @media (orientation:portrait) and (max-width:700px) { .rotate-hint { display:block; } .rotate-hint.hide { display:none; } }
  @media (max-height:520px) { .commentary-bar { display:none !important; } .hud { padding:2px 8px; } .first-to { display:none; } #gameScreen { gap:2px; padding:2px; } }
  .commentary-bar { width:100%; max-width:960px; background:#090d16; color:#fff; padding:4px 10px; border-radius:6px; border-left:4px solid var(--neon); font-size:.76rem; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0; }

  /* Overlays */
  .overlay { position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(3,5,10,.86); }
  .fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  .dlg { position:relative; z-index:2; background:linear-gradient(160deg,#1c263b,#0e1420); border:3px solid var(--gold); border-radius:20px; padding:22px 26px; max-width:460px; width:100%; text-align:center; box-shadow:0 0 40px rgba(255,204,0,.35); animation:zoomIn .35s ease-out; }
  .dlg h3 { color:var(--gold); font-size:1.3rem; margin-bottom:10px; }
  .dlg-body { color:#d4def0; font-size:.88rem; line-height:1.5; margin-bottom:14px; max-height:50vh; overflow-y:auto; }
  .dlg-btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .result-box { position:relative; z-index:2; width:100%; max-width:560px; text-align:center; background:linear-gradient(160deg,#1c263b,#0b1120); border:4px solid var(--gold); border-radius:26px; padding:22px 20px; box-shadow:0 0 70px rgba(255,204,0,.45); animation:zoomIn .5s ease-out; }
  .res-kicker { color:var(--neon); font-weight:900; letter-spacing:4px; font-size:.85rem; }
  .res-row { display:flex; align-items:center; justify-content:center; gap:14px; margin:12px 0; }
  .res-team { display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; font-weight:800; font-size:.85rem; }
  .res-score { font-size:2.8rem; font-weight:900; color:#fff; text-shadow:0 0 18px rgba(255,204,0,.7); }
  .res-banner { font-size:1.9rem; font-weight:900; margin:6px 0 10px; letter-spacing:2px; }
  .res-banner.win { background:linear-gradient(#fff,#ffe27a,#ff9d00); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 12px rgba(255,170,0,.6)); }
  .res-banner.lose { color:#8aa4d6; }
  .res-stats { display:flex; justify-content:center; gap:22px; font-size:.78rem; color:#b0c4de; margin-bottom:14px; }
  .ceremony-box { position:relative; z-index:2; background:linear-gradient(135deg,#1c263b,#0e1420); border:4px solid var(--gold); border-radius:24px; padding:24px 40px; box-shadow:0 0 60px rgba(255,204,0,.7); animation:zoomIn .6s ease-out; max-width:500px; width:100%; text-align:center; }
  @keyframes zoomIn { from { transform:scale(.5); opacity:0; } to { transform:scale(1); opacity:1; } }
  .champions-title { font-size:2rem; font-weight:900; color:var(--gold); text-shadow:0 0 20px var(--neon); margin:6px 0; }
  .winner-team-name { font-size:1.5rem; font-weight:900; color:#fff; margin-bottom:6px; text-transform:uppercase; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div id="toast"></div>

<!-- 0. SPLASH (drawn on canvas) -->
<div id="splashScreen" class="screen transparent active" style="cursor:pointer;" onclick="enterMenu()"></div>

<!-- 1. MAIN MENU -->
<div id="menuScreen" class="screen transparent">
  <div class="header">
    <div class="logo">⚽ FOOTBALL MANIA 2D</div>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-secondary btn-small" id="langBtn" onclick="toggleLang()">العربية</button>
      <button class="btn btn-secondary btn-small" id="sndBtnMenu" onclick="toggleSound()">🔊</button>
      <button class="btn btn-secondary btn-small" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div class="menu-wrap">
    <div>
      <div class="menu-sub" data-i18n="menuSub"></div>
      <div class="menu-title">FOOTBALL MANIA 2D</div>
    </div>
    <div class="mode-container">
      <div class="card" onclick="openMode('WC')"><span class="save-badge" id="saveBadgeWC" data-i18n="continueBadge"></span><div class="ico">🏆</div><h2 data-i18n="modeWC"></h2><p data-i18n="modeWCd"></p></div>
      <div class="card" onclick="openMode('LEAGUE')"><span class="save-badge" id="saveBadgeLEAGUE" data-i18n="continueBadge"></span><div class="ico">🌍</div><h2 data-i18n="modeLG"></h2><p data-i18n="modeLGd"></p></div>
      <div class="card" onclick="openSetup('QUICK')"><div class="ico">⚡</div><h2 data-i18n="modeAI"></h2><p data-i18n="modeAId"></p></div>
      <div class="card" onclick="start2PlayerMode()" style="border-color:rgba(0,255,136,.5);"><div class="ico">👥</div><h2 data-i18n="mode2P"></h2><p data-i18n="mode2Pd"></p></div>
    </div>
  </div>
  <div class="foot-note" data-i18n="footNote"></div>
</div>

<!-- SETTINGS -->
<div id="settingsModal" class="overlay">
  <div class="dlg settings-dlg">
    <h3 data-i18n="settingsT"></h3>
    <div class="set-row"><span data-i18n="language"></span>
      <div class="seg"><button data-set="lang" data-val="en" onclick="setLang('en')">English</button><button data-set="lang" data-val="ar" onclick="setLang('ar')">العربية</button></div></div>
    <div class="set-row"><span data-i18n="sound"></span>
      <div class="seg"><button data-set="sound" data-val="on" onclick="setSound(true)" data-i18n="on"></button><button data-set="sound" data-val="off" onclick="setSound(false)" data-i18n="off"></button></div></div>
    <div class="set-row"><span data-i18n="commentary"></span>
      <div class="seg"><button data-set="comm" data-val="on" onclick="setCommentary(true)" data-i18n="on"></button><button data-set="comm" data-val="off" onclick="setCommentary(false)" data-i18n="off"></button></div></div>
    <div class="set-row" id="voiceRow" style="display:none"><span data-i18n="voiceMissing" style="font-size:.78rem; color:#ffcc00; font-weight:700;"></span>
      <button class="btn btn-small" onclick="installVoice()" data-i18n="installVoice"></button></div>
    <div class="set-row"><span data-i18n="vibration"></span>
      <div class="seg"><button data-set="vib" data-val="on" onclick="setVib(true)" data-i18n="on"></button><button data-set="vib" data-val="off" onclick="setVib(false)" data-i18n="off"></button></div></div>
    <div class="set-row"><span data-i18n="howTo"></span>
      <button class="btn btn-secondary btn-small" onclick="replayTutorial()" data-i18n="showTut"></button></div>
    <div class="set-row"><span data-i18n="fullscreenL"></span>
      <button class="btn btn-secondary btn-small" onclick="toggleFullscreen()">⛶</button></div>
    <button class="btn" style="margin-top:12px;" onclick="closeSettings()" data-i18n="close"></button>
  </div>
</div>

<!-- 2. TEAM SELECTION -->
<div id="setupScreen" class="screen">
  <div class="header">
    <button class="btn btn-secondary btn-small" onclick="setupBack()" data-i18n="back"></button>
    <div class="logo" id="teamSelectTitle"></div>
    <div style="font-size:.72rem; color:var(--gold);" data-i18n="tapTeam"></div>
  </div>
  <div class="selector-box">
    <div class="league-tabs" id="categoryTabs"></div>
    <div class="teams-grid" id="teamsGrid"></div>
  </div>
</div>

<!-- MATCH SETTINGS -->
<div id="matchSettingsScreen" class="modal-screen">
  <div class="logo" style="font-size:1.15rem; color:var(--gold);" data-i18n="p1Setup"></div>
  <p style="color:#aaa; font-size:.78rem; margin:3px 0;"><span data-i18n="configFor"></span> <span id="chosenTeamName" style="color:var(--neon); font-weight:bold;"></span></p>

  <div class="settings-wrap">
  <div class="settings-section">
    <h4 data-i18n="tacticsH"></h4>
    <div class="options-grid" data-cat="tactics">
      <div class="opt-card" data-val="BALANCED" onclick="selectOpt('tactics','BALANCED',this)" data-i18n="tacBal"></div>
      <div class="opt-card" data-val="ATTACKING" onclick="selectOpt('tactics','ATTACKING',this)" data-i18n="tacAtt"></div>
      <div class="opt-card" data-val="DEFENSIVE" onclick="selectOpt('tactics','DEFENSIVE',this)" data-i18n="tacDef"></div>
    </div>
  </div>

  <div class="settings-section">
    <h4 data-i18n="goalsH"></h4>
    <div class="options-grid" data-cat="goals">
      <div class="opt-card" data-val="1" onclick="selectOpt('goals','1',this)" data-i18n="goals1"></div>
      <div class="opt-card" data-val="3" onclick="selectOpt('goals','3',this)" data-i18n="goals3"></div>
      <div class="opt-card" data-val="5" onclick="selectOpt('goals','5',this)" data-i18n="goals5"></div>
    </div>
  </div>

  <div class="settings-section">
    <h4 data-i18n="ballH"></h4>
    <div class="options-grid" data-cat="ballType">
      <div class="opt-card" data-val="SLOW" onclick="selectOpt('ballType','SLOW',this)"><canvas width="40" height="40" data-ball="SLOW"></canvas><span data-i18n="ballSlow"></span></div>
      <div class="opt-card" data-val="NORMAL" onclick="selectOpt('ballType','NORMAL',this)"><canvas width="40" height="40" data-ball="NORMAL"></canvas><span data-i18n="ballMed"></span></div>
      <div class="opt-card" data-val="FAST" onclick="selectOpt('ballType','FAST',this)"><canvas width="40" height="40" data-ball="FAST"></canvas><span data-i18n="ballFast"></span></div>
    </div>
  </div>

  <div class="settings-section">
    <h4 data-i18n="stadH"></h4>
    <div class="options-grid" data-cat="stadium">
      <div class="opt-card" data-val="CLASSIC" onclick="selectOpt('stadium','CLASSIC',this)"><canvas width="120" height="75" data-stad="CLASSIC"></canvas><span data-i18n="stClassic"></span></div>
      <div class="opt-card" data-val="NIGHT" onclick="selectOpt('stadium','NIGHT',this)"><canvas width="120" height="75" data-stad="NIGHT"></canvas><span data-i18n="stNight"></span></div>
      <div class="opt-card" data-val="ELITE" onclick="selectOpt('stadium','ELITE',this)"><canvas width="120" height="75" data-stad="ELITE"></canvas><span data-i18n="stElite"></span></div>
    </div>
  </div>

  <div class="settings-section" id="aiLevelSection">
    <h4 data-i18n="aiH"></h4>
    <div class="options-grid" data-cat="aiLevel">
      <div class="opt-card" data-val="EASY" onclick="selectOpt('aiLevel','EASY',this)" data-i18n="aiEasy"></div>
      <div class="opt-card" data-val="NORMAL" onclick="selectOpt('aiLevel','NORMAL',this)" data-i18n="aiNormal"></div>
      <div class="opt-card" data-val="HARD" onclick="selectOpt('aiLevel','HARD',this)" data-i18n="aiHard"></div>
    </div>
  </div>

  </div>
  <div style="display:flex; gap:10px; margin-top:8px;">
    <button class="btn btn-secondary" style="padding:9px 20px;" onclick="closeMatchSettings()" data-i18n="cancel"></button>
    <button class="btn" style="padding:9px 28px; font-size:.95rem;" onclick="proceedAppSettings()" data-i18n="continueBtn"></button>
  </div>
</div>

<!-- PLAYER 2 FORMATION -->
<div id="p2FormationScreen" class="modal-screen">
  <div class="logo" style="font-size:1.15rem; color:var(--gold);" data-i18n="p2Setup"></div>
  <p style="color:#aaa; font-size:.78rem; margin:3px 0;"><span data-i18n="p2For"></span> (<span id="p2TeamName" style="color:var(--neon); font-weight:bold;"></span>)</p>
  <div class="settings-section">
    <h4 data-i18n="p2Tac"></h4>
    <div class="options-grid" data-cat="tacticsP2">
      <div class="opt-card" data-val="BALANCED" onclick="selectOpt('tacticsP2','BALANCED',this)" data-i18n="tacBal"></div>
      <div class="opt-card" data-val="ATTACKING" onclick="selectOpt('tacticsP2','ATTACKING',this)" data-i18n="tacAtt"></div>

function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function simGoals(a, b) {

  return [poisson(Math.max(0.25, base * Math.exp(d * 0.45))), poisson(Math.max(0.25, base * Math.exp(-d * 0.45)))];
}
function simWinner(a, b) {
  const [x, y] = simGoals(a, b); if (x !== y) return x > y ? a : b;
  return Math.random() < 0.5 + (a.ovr - b.ovr) * 0.02 ? a : b;
}
function newRow(team) { return { team, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; }
function applyRow(map, x, y, gx, gy) {
  const a = map[x.id], b = map[y.id];

  if (gx > gy) { a.w++; a.pts += 3; b.l++; } else if (gx < gy) { b.w++; b.pts += 3; a.l++; } else { a.d++; b.d++; a.pts++; b.pts++; }
}
const rowSort = (a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;

function createLeague(name) {
  const teams = shuffle(DB.LEAGUES[name]), n = teams.length, arr = teams.slice(), schedule = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = []; for (let i = 0; i < n / 2; i++) pairs.push([arr[i], arr[n - 1 - i]]);
    schedule.push(pairs); arr.splice(1, 0, arr.pop());
  }
  const table = {}; teams.forEach(t => table[t.id] = newRow(t));
  return { type: 'LEAGUE', name, round: 0, schedule, table, last: '' };
}
function leagueOpponent(T) {

  return f[0].id === selectedTeam.id ? f[1] : f[0];
}
const WC_PAIRS = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
function createWC() {

/* ----- input ----- */

}
function onInputStart(e) {

}

/* ----- AI ----- */
function aiShot() {

  const discs = g.discs.filter(d => d.side === 'AWAY'), b = g.ball;
  const ang = Math.atan2(BH / 2 + rand(-30, 30) - b.y, PL - 8 - b.x);
  let best = null, bs = -1e9;
  discs.forEach(d => {
    d.tx = b.x - Math.cos(ang) * (b.r + d.r - 2); d.ty = b.y - Math.sin(ang) * (b.r + d.r - 2);
    const dist = Math.hypot(d.tx - d.x, d.ty - d.y), sc = (d.x > b.x - 5 ? 100 : -60) - dist * 0.35 + rand(0, 35);
    if (sc > bs) { bs = sc; best = d; }

  const sigma = Math.max(0.015, (0.15 - (g.away.ovr - 70) * 0.004) * lvl);
  const a = Math.atan2(best.ty - best.y, best.tx - best.x) + gauss() * sigma;

/* ----- physics ----- */
function stepPhysics() {
  const g = game, all = [...g.discs, g.ball], SUB = 3, b = g.ball;
  const posts = [[PL, GT], [PL, GB], [PR, GT], [PR, GB]];
  for (let s = 0; s < SUB; s++) {
    for (const o of all) { o.x += o.vx / SUB; o.y += o.vy / SUB; }
    if (b.y > GT && b.y < GB) {
      if (b.x < PL - 4) { onGoal(false); return; }
      if (b.x > PR + 4) { onGoal(true); return; }
    }
    for (const o of all) {
      const isBall = o === b, mouth = o.y > GT && o.y < GB;
      if (o.y - o.r < PT) { o.y = PT + o.r; if (Math.abs(o.vy) > 2) SFX.wall(Math.abs(o.vy)); o.vy *= -0.82; }
      if (o.y + o.r > PB) { o.y = PB - o.r; if (Math.abs(o.vy) > 2) SFX.wall(Math.abs(o.vy)); o.vy *= -0.82; }
      if (!(isBall && mouth)) {
        if (o.x - o.r < PL) { o.x = PL + o.r; if (Math.abs(o.vx) > 2) SFX.wall(Math.abs(o.vx)); o.vx *= -0.82; }
        if (o.x + o.r > PR) { o.x = PR - o.r; if (Math.abs(o.vx) > 2) SFX.wall(Math.abs(o.vx)); o.vx *= -0.82; }
      }

        const dot = o.vx * nx + o.vy * ny;
        if (dot < 0) { o.vx = (o.vx - 2 * dot * nx) * 0.8; o.vy = (o.vy - 2 * dot * ny) * 0.8; if (o === b && -dot > 2) { SFX.post(); if (Math.random() < .5) speak('post'); } }
      }
    }

      const a = all[i], c2 = all[j]; let dx = c2.x - a.x, dy = c2.y - a.y, dist = Math.hypot(dx, dy); const minD = a.r + c2.r;
      if (dist < minD) {

  for (const o of all) { o.vx *= g.friction; o.vy *= g.friction; if (Math.hypot(o.vx, o.vy) < 0.09) { o.vx = 0; o.vy = 0; } else movingCount++; }
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > 0.05) { rotateOrient(b.orient, -b.vy / sp, b.vx / sp, 0, sp / BR); }
  if (g.moving && movingCount === 0) {
    g.moving = false; g.turn = g.turn === 'HOME' ? 'AWAY' : 'HOME'; updateTurnUI();

  }
}

    { text: t('contBtn'), fn: () => resumeSave(mode) },
    { text: t('newBtn'), secondary: true, fn: () => showDialog(t('newT'), t('newB'), [
      { text: t('cancel'), secondary: true },
      { text: t('startNew'), fn: () => openSetup(mode) }
    ]) }
  ]);
}
function resumeSave(mode) {
  const d = loadSlot(mode);
  if (!d) { toast(t('tLoadFail')); clearSlot(mode); refreshSaveBadges(); return; }
  currentMode = mode; is2PlayerMode = false;
  selectedTeam = d.team; tournament = d.tournament;
  if (d.settings) { currentTactics = d.settings.tactics || currentTactics; currentBallType = d.settings.ballType || currentBallType; currentStadium = d.settings.stadium || currentStadium; currentAI = d.settings.ai || currentAI; currentGoals = d.settings.goals || currentGoals; }
  if (tournament.type === 'LEAGUE') currentCategory = tournament.name;
  const m = d.match;
  if (m && m.finished) { finishMatchResult(m.scoreH, m.scoreA); return; }
  if (m) { resumeMatch(m); return; }
  renderHub(); showScreen('hubScreen'); toast(t('tWelcome'));
}
function matchSnapshot() {
  const g = game; if (!g) return null;
  const snap = {
    away: g.away, scoreH: g.scoreH, scoreA: g.scoreA, tactics: g.tactics, aiTactics: g.aiTactics,
    ballType: g.ballType, stadium: g.stadium, aiLevel: g.aiLevel, turn: g.turn, moving: g.moving, shots: g.shots, target: g.target,
    discs: g.discs.map(d => ({ x: d.x, y: d.y, vx: d.vx, vy: d.vy })),
    ball: { x: g.ball.x, y: g.ball.y, vx: g.ball.vx, vy: g.ball.vy }
  };
  if (g.over) snap.finished = true;
  else if (g.cele) { snap.discs = null; snap.ball = null; snap.moving = false; snap.turn = g.cele.byHome ? 'AWAY' : 'HOME'; if (g.cele.final) snap.finished = true; }
  return snap;
}
function resumeMatch(m) {
  pendingOpponent = m.away; currentGoals = m.target || currentGoals;
  startDiscMatch(selectedTeam, m.away, m.tactics, m.ballType, m.stadium, false, 'BALANCED', m.aiLevel);
  const g = game;
  g.aiTactics = m.aiTactics || g.aiTactics; resetPositions();
  g.scoreH = m.scoreH; g.scoreA = m.scoreA; g.shots = m.shots || g.shots;
  if (m.discs && m.discs.length === g.discs.length) m.discs.forEach((s, i) => Object.assign(g.discs[i], s));
  if (m.ball) Object.assign(g.ball, m.ball);
  g.turn = m.turn || 'HOME'; g.moving = !!m.moving; g.tut = null;
  $('hudFirstTo').innerText = g.target === 1 ? t('firstTo1') : t('firstTo', { n: g.target });
  $('hudScore').innerText = `${g.scoreH} - ${g.scoreA}`; updateTurnUI();
  g.aiTimer = (g.turn === 'AWAY' && !g.moving) ? 60 : 0;
  speak('', `${t('welcomeSpeak')} ${selectedTeam.name} ${g.scoreH} - ${g.scoreA} ${g.away.name}`);
}
function inTournament() { return (currentMode === 'WC' || currentMode === 'LEAGUE') && !!tournament; }
function saveAndQuitMatch() {
  if (!game || !inTournament()) return;
  const snap = matchSnapshot(); const ok = saveSlot(currentMode, snap);
  tournament = null; cleanupGame(); $('resultModal').style.display = 'none'; FX.stop();
  showScreen('menuScreen'); toast(ok ? t('tMatchSaved') : t('tSaveFail'));
}
/* Auto-save when the app goes to the background or closes */
function autoSaveNow() {
  if (!inTournament()) return;
  const act = document.querySelector('.screen.active'); const id = act ? act.id : '';
  if (id === 'gameScreen' && game) saveSlot(currentMode, matchSnapshot());
  else saveSlot(currentMode, null);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) autoSaveNow(); });
window.addEventListener('pagehide', autoSaveNow);

/* Android hardware back button (called from the native wrapper) */
window.fmBack = function () {
  const vis = id => { const e = $(id); return e && getComputedStyle(e).display !== 'none'; };
  if (vis('dialog')) { $('dialog').style.display = 'none'; simPaused = false; return true; }
  if (vis('settingsModal')) { closeSettings(); return true; }
  if (vis('resultModal')) { closeResult(); return true; }
  if (vis('wcFinalModal')) { closeCeremony(); return true; }
  if (vis('p2FormationScreen')) { $('p2FormationScreen').style.display = 'none'; $('matchSettingsScreen').style.display = 'flex'; return true; }
  if (vis('matchSettingsScreen')) { $('matchSettingsScreen').style.display = 'none'; return true; }
  const act = document.querySelector('.screen.active'); const id = act ? act.id : '';
  if (id === 'gameScreen') { forfeitMatch(); return true; }
  if (id === 'setupScreen') { setupBack(); return true; }
  if (id === 'hubScreen') { leaveTournament(); return true; }
  return false;
};
document.addEventListener('visibilitychange', () => { try { if (!SFX.ctx) return; if (document.hidden) SFX.ctx.suspend(); else SFX.ctx.resume(); } catch (e) {} });

/* ==========================================================
   12. BOOT
   ========================================================== */
SFX.setMuted(!!SETTINGS.muted);
applyLang(); refreshSoundButtons();
bgResize();
bg.raf = requestAnimationFrame(bgFrame);
</script>
</body>
