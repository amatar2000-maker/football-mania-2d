name: Build Android App Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Check signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restore upload keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: football-mania-2d-aab-v${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload APK (to test on your phone)
        uses: actions/upload-artifact@v4
        with:
          name: football-mania-2d-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
